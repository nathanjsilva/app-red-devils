services:
  web:
    image: nginx:alpine
    container_name: app_red_devils_web
    restart: unless-stopped
    ports:
      - "8080:80"
      - "443:443"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx/production.conf:/etc/nginx/conf.d/default.conf:ro
      - /home/ubuntu/certs:/etc/nginx/certs:ro
